<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>유리나무 작업 허브 · YURIWOOD WORK HUB</title>
  <meta name="description" content="자주 사용하는 웹사이트를 카테고리별로 모아 바로 이동할 수 있는 개인 작업 허브." />
  <meta name="color-scheme" content="light" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    onerror="this.remove()"
  />
  <link rel="stylesheet" href="styles.css" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23151719'/%3E%3Ctext x='16' y='21' font-family='Helvetica,Arial' font-size='14' font-weight='600' fill='%23F4F1EB' text-anchor='middle'%3EYW%3C/text%3E%3C/svg%3E"
  />
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <div class="layout">
    <!-- 왼쪽 고정 사이드바 (모바일에서는 드로어) -->
    <aside class="sidebar" id="sidebar" aria-label="사이트 메뉴">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">YW</span>
        <p class="brand__ko">유리나무 작업 허브</p>
        <p class="brand__en">YURIWOOD WORK HUB</p>
      </div>
      <nav class="nav" id="nav" aria-label="카테고리 메뉴"></nav>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <div class="content">
      <header class="topbar">
        <button
          class="hamburger"
          id="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          <span class="hamburger__bars" aria-hidden="true"></span>
          <span class="hamburger__text">메뉴</span>
        </button>

        <nav class="crumb" aria-label="현재 위치">
          <ol class="crumb__list" id="breadcrumb"></ol>
        </nav>

        <p class="topbar__date">
          <time id="today" datetime="">&nbsp;</time>
        </p>
      </header>

      <main class="main" id="main" tabindex="-1">
        <section class="masthead" aria-labelledby="masthead-title">
          <p class="eyebrow">PERSONAL WORKSPACE / 2026</p>
          <h1 class="masthead__title" id="masthead-title">
            오늘의 작업을<br />가볍게 시작하세요.
          </h1>
          <p class="masthead__meta">
            <span class="masthead__view" id="current-view"></span>
            <span class="masthead__sep" aria-hidden="true">·</span>
            <span class="masthead__count" id="current-count"></span>
          </p>
        </section>

        <div id="view" aria-live="polite"></div>
      </main>

      <footer class="foot">
        <p class="foot__brand">YURIWOOD · CREATIVE WORKSPACE</p>
        <p class="foot__meta" id="foot-count"></p>
      </footer>
    </div>
  </div>

  <noscript>
    <p class="noscript">이 페이지는 메뉴와 링크 목록을 JavaScript로 생성합니다. 브라우저에서 JavaScript를 켜주세요.</p>
  </noscript>

  <script src="script.js" defer></script>
</body>
</html>
