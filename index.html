<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>유리나무 작업 허브 · YURIWOOD WORK HUB</title>
  <meta name="description" content="AI·개발·디자인·수업·사업·업무 6개 카테고리로 정리한 65개 작업 사이트를 검색하고 바로 여는 개인 작업 허브." />
  <meta name="color-scheme" content="light" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    onerror="this.remove()"
  />
  <link rel="stylesheet" href="styles.css" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23446592'/%3E%3Ctext x='16' y='21' font-family='Helvetica,Arial' font-size='14' font-weight='600' fill='%23FFFFFF' text-anchor='middle'%3EYW%3C/text%3E%3C/svg%3E"
  />
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <div class="layout">
    <!-- 왼쪽 고정 사이드바 (모바일에서는 드로어) -->
    <aside class="sidebar" id="sidebar" aria-label="사이트 메뉴">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">YW</span>
        <p class="brand__ko">유리나무 작업 허브</p>
        <p class="brand__en">YURIWOOD WORK HUB</p>
      </div>
      <nav class="nav" id="nav" aria-label="카테고리 메뉴"></nav>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <div class="content">
      <header class="topbar">
        <button
          class="hamburger"
          id="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          <span class="hamburger__bars" aria-hidden="true"></span>
          <span class="hamburger__text">메뉴</span>
        </button>

        <form class="search" id="search-form" role="search" aria-label="사이트 통합 검색">
          <label class="search__label" for="search-input">사이트 검색</label>
          <div class="search__field">
            <span class="search__icon" aria-hidden="true"></span>
            <input
              class="search__input"
              id="search-input"
              type="search"
              name="q"
              placeholder="사이트, 카테고리, 태그 검색"
              autocomplete="off"
              spellcheck="false"
            />
            <button class="search__clear" id="search-clear" type="button" aria-label="검색어 지우기" hidden>
              <span aria-hidden="true">×</span>
            </button>
          </div>
        </form>

        <p class="topbar__date">
          <time id="today" datetime="">&nbsp;</time>
        </p>
      </header>

      <main class="main" id="main" tabindex="-1">
        <nav class="crumb" aria-label="현재 위치">
          <ol class="crumb__list" id="breadcrumb"></ol>
        </nav>

        <section class="masthead" aria-labelledby="masthead-title">
          <p class="eyebrow">PERSONAL WORKSPACE / 2026</p>
          <h1 class="masthead__title" id="masthead-title">
            오늘의 작업을<br />가볍게 시작하세요.
          </h1>
          <p class="masthead__meta">
            <span class="masthead__view" id="current-view"></span>
            <span class="masthead__sep" aria-hidden="true">·</span>
            <span class="masthead__count" id="current-count"></span>
          </p>
        </section>

        <!-- 작업 런처: '전체 사이트' 화면이고 검색 중이 아닐 때만 표시 -->
        <section class="launcher" id="launcher" aria-labelledby="launcher-title" hidden>
          <div class="launcher__head">
            <h2 class="launcher__title" id="launcher-title">작업 런처</h2>
            <p class="launcher__desc">목적을 선택하면 필요한 작업 순서와 도구를 모아서 보여드려요.</p>
          </div>
          <div class="launcher__grid" id="launcher-grid"></div>
          <div
            class="lpanel"
            id="launcher-detail"
            role="region"
            tabindex="-1"
            hidden
          ></div>
        </section>

        <div id="view" aria-live="polite"></div>
      </main>

      <footer class="foot">
        <p class="foot__brand">YURIWOOD · CREATIVE WORKSPACE</p>
        <p class="foot__meta" id="foot-count"></p>
      </footer>
    </div>
  </div>

  <noscript>
    <p class="noscript">이 페이지는 메뉴와 링크 목록을 JavaScript로 생성합니다. 브라우저에서 JavaScript를 켜주세요.</p>
  </noscript>

  <script src="script.js" defer></script>
</body>
</html>
